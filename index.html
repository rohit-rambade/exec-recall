<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exec Recall</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236366f1'/><text x='16' y='22' font-size='16' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'>ER</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link id="hljs-theme" rel="stylesheet" href="assets/vendor/hljs-light.css">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    // apply saved theme before paint
    try { if ((localStorage.getItem("tn-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a href="#/" class="brand"><span class="brand-logo">ER</span><span class="brand-name" id="brandName">Exec Recall</span></a>
    <nav class="tech-tabs" id="techTabs"></nav>
    <button class="search-trigger" id="searchBtn">
      <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Search notes</span><kbd>Ctrl K</kbd>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
      <svg class="sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="moon" viewBox="0 0 24 24" width="18" height="18"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
    </button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-col">
      <main class="main" id="main"></main>
      <footer class="site-footer">Made with <span class="heart" aria-label="love">♥</span> by <strong>Rohit R</strong></footer>
    </div>
    <aside class="toc" id="toc"></aside>
  </div>
  <div class="scrim" id="scrim"></div>

  <div class="search-modal" id="searchModal" hidden>
    <div class="search-box">
      <div class="search-input-row">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" placeholder="Search topics, headings and content…" autocomplete="off">
        <kbd>Esc</kbd>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <button class="to-top" id="toTop" aria-label="Back to top">↑</button>

  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/vendor/highlight.min.js"></script>
  <script src="site-data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
